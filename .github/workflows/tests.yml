# SPDX-License-Identifier: GPL-3.0-only
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: black --check proton_launcher tests

      - name: Lint
        run: ruff check proton_launcher tests

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Check shell syntax
        run: bash -n run.sh build-helper.sh install-desktop-entry.sh
